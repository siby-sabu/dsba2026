steps:
  # Build the Docker image for frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/agri-frontend:v1'
      - '-f'
      - 'frontend/Dockerfile'
      - '--build-arg'
      - 'REACT_APP_API_URL=${_BACKEND_URL}/api/v1'
      - '.'

# Push the image to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/agri-frontend:v1'

# Optional: timeout after 10 minutes
timeout: 600s

# Substitution variables (MUST be provided with --substitutions)
# Example: --substitutions=_BACKEND_URL="https://your-backend-url"
substitutions:
  _BACKEND_URL: ''  # Empty - must be provided at build time
